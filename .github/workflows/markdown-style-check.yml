name: Markdown Style Check

on:
  workflow_dispatch:

jobs:
  markdown-style:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint markdown style (optional)
        run: python3 scripts/check_markdown_style.py
