name: Docs Link Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  markdown-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate markdown links
        run: python3 scripts/check_markdown_links.py
