name: Quality Suite

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-quality-suite:
    name: Validate quality suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run validators and build report
        shell: bash
        run: |
          set +e
          mkdir -p artifacts

          REPORT_FILE="artifacts/quality-suite-report.md"
          LOG_FILE="artifacts/quality-suite.log"

          printf "# Quality Suite Report\n\n" > "$REPORT_FILE"
          printf "Generated by .github/workflows/quality-suite.yml\n\n" >> "$REPORT_FILE"

          run_check() {
            local label="$1"
            local command="$2"
            local required="$3"

            printf "\n=== %s ===\n" "$label" >> "$LOG_FILE"
            eval "$command" >> "$LOG_FILE" 2>&1
            local code=$?

            if [ "$code" -eq 0 ]; then
              printf "- %s: PASS\n" "$label" >> "$REPORT_FILE"
            else
              if [ "$required" = "required" ]; then
                printf "- %s: FAIL (required)\n" "$label" >> "$REPORT_FILE"
                REQUIRED_FAILURE=1
              else
                printf "- %s: WARN (optional)\n" "$label" >> "$REPORT_FILE"
              fi
            fi
          }

          REQUIRED_FAILURE=0

          run_check "Release manifest validator" "python3 scripts/check_release_manifests.py" "required"
          run_check "Docs link validator" "python3 scripts/check_markdown_links.py" "required"
          run_check "Docs-manifest parity validator" "python3 scripts/check_docs_manifest_parity.py" "required"
          run_check "Markdown style lint" "python3 scripts/check_markdown_style.py" "optional"

          printf "\n## Notes\n" >> "$REPORT_FILE"
          printf "- Required checks must pass for this workflow to succeed.\n" >> "$REPORT_FILE"
          printf "- Markdown style lint is informational-only in this suite.\n" >> "$REPORT_FILE"
          printf "\n## Raw Log\n" >> "$REPORT_FILE"
          printf "See artifacts/quality-suite.log in workflow artifacts.\n" >> "$REPORT_FILE"

          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"

          if [ "$REQUIRED_FAILURE" -ne 0 ]; then
            echo "One or more required checks failed."
            exit 1
          fi

      - name: Upload quality suite artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-suite-report
          path: artifacts/
