name: Docs Manifest Parity Check

on:
  workflow_dispatch:

jobs:
  docs-manifest-parity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate docs to manifest parity
        run: python3 scripts/check_docs_manifest_parity.py
